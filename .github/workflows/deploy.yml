name: CI/CD Production Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Ubuntu Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source Code
        uses: actions/checkout@v4

      - name: Execute Remote Deployment Commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd ${{ secrets.TARGET_DIR }}
            git pull origin main
            echo "Building new Docker image locally..."
            docker build -t react-app-prod:latest .
            echo "Stopping old containers..."
            docker stop react-app-container || true
            docker rm react-app-container || true
            echo "Launching updated application container..."
            docker run -d \
              --name react-app-container \
              --restart unless-stopped \
              -p 80:80 \
              react-app-prod:latest
            echo "Cleaning up dangling Docker contexts..."
            docker image prune -f
